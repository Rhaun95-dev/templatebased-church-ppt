services:
  - type: web
    name: church-ppt-tool
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    autoDeployTrigger: checksPass  # CI(.github/workflows/ci.yml)가 통과한 커밋만 배포
    envVars:
      - key: STORAGE
        value: supabase
      - key: APP_PASSWORD
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
