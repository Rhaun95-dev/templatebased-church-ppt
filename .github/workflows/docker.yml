name: Docker build
# Render builds this image from the Dockerfile. Verify it still builds before merging.
# Only runs when something that affects the image changes (the apt layer is slow).
on:
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - requirements.txt
      - render.yaml
  workflow_dispatch:

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
